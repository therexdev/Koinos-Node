name: Release installers

# Builds and publishes installers to a GitHub Release whenever a version tag
# is pushed:  npm version minor && git push --follow-tags
# Also runnable manually (Actions tab → Release installers → Run workflow).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Create the release once, up front, as a draft. This avoids the race where
  # three parallel build jobs each try to CREATE the release and all but one
  # get "422 already_exists".
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure a draft release exists for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists — reusing it."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
              --title "$TAG" \
              --notes "Automated build of $TAG. Windows, macOS and Linux installers are attached below."
          fi

  # Each OS builds and uploads its installer to the existing draft release.
  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      # publish.releaseType is "draft", so electron-builder finds the draft
      # created above (matched by tag) and just uploads to it — no create race.
      - run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Once every OS has uploaded, flip the draft to a published release. The tag
  # shape picks the channel: a prerelease tag (vX.Y.Z-beta.N — anything with a
  # hyphen) is published as a GitHub Pre-release and is NEVER marked "latest",
  # so stable/live installs don't pick it up; a plain tag is published as
  # "latest" for everyone. The auto-updater side of this lives in
  # setupAutoUpdates() (allowPrerelease keys off the build's own version).
  publish-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release (stable = latest, prerelease = beta channel)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == *-* ]]; then
            echo "Prerelease $TAG → beta channel (not marked latest)."
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
          else
            echo "Stable $TAG → latest."
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
          fi
